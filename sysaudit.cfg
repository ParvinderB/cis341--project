#!/bin/bash

##config file for the system audit program
# contains stuff needed for the program to run correctly 
# subject to change

AUDIT_DIR=/cis341--project/audit # directory for audit report should be changed to allow running on any server
LOG_FILE=/var/log/sysaudit_daemon.log #log file location \\ this should work on any system

SCAN_INTERVAL_SECONDS=60 # frequency of system scan in seconds \\this can be changed later its short for testing
MAX_DISK_USAGE=100 #disk usage ceiling in megabytes

RETENTION_DAYS=14 # log retention, should be cleared every 14 days 
CLEANUP_INTERVAL_DAYS=3 # cron cleanup timer 

DEFAULT_MODE=daemon #executes as a daemon

## tasks 5, 7, 8 (logging, archive summary, disk ceiling)
LOG_LEVEL=INFO # lowest level written to the log: ERROR, WARN, INFO or DEBUG
ARCHIVE_EXTENSIONS=tar.gz,zip # archive types counted in the summary, comma separated


